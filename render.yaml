services:
  - type: web
    name: makerbase-api
    runtime: node
    region: ohio
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: makerbase-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: makerbase-db
    databaseName: makerbase
    user: makerbase
    region: ohio
    plan: starter
    ipAllowList: []
