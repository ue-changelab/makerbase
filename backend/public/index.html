<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakerBase — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── styles.css verbatim ── */
:root{--bg:#faf6ef;--bg-tint:#f2ebdd;--bg-deep:#1a0e2e;--ink:#1a0e2e;--ink-soft:#4a3d5c;--ink-muted:#7a6f86;--rule:#e2d9c7;--purple:#4c1d6b;--purple-deep:#2d0f44;--purple-soft:#f1e8f7;--orange:#ec6a2a;--orange-deep:#c4501c;--orange-soft:#fde6d6;--gold:#e8b24a;--success:#2f7d5b;--danger:#b83b2b;--r-sm:4px;--r-md:8px;--r-lg:14px;--r-xl:22px;--font-display:'Fraunces','Times New Roman',serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--maxw:1280px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.eyebrow .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-right:10px;vertical-align:middle;transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;transition:all 180ms}
.btn-primary{background:var(--purple);color:var(--bg)}
.btn-primary:hover{background:var(--purple-deep)}
.btn-soft{background:var(--bg-tint);color:var(--ink)}
.btn-soft:hover{background:var(--rule)}
.btn-accent{background:var(--orange);color:#fff}
.btn-accent:hover{background:var(--orange-deep)}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border-radius:var(--r-md);border:1px solid var(--rule);background:var(--bg);font-size:15px;outline:none;transition:border-color 150ms,box-shadow 150ms}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
/* ── staff.css verbatim ── */
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr;background:var(--bg)}
.sidebar{background:var(--bg-deep);color:var(--bg);padding:24px 20px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-size:20px;margin-bottom:28px}
.sidebar-brand .mark{width:32px;height:32px;border-radius:8px;background:var(--bg);color:var(--purple);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:14px;position:relative}
.sidebar-brand .mark::after{content:"";position:absolute;inset:-3px -3px auto auto;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.sidebar-section{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,246,239,.4);padding:16px 10px 8px}
.sidebar a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);font-size:14px;color:rgba(250,246,239,.7);transition:all 140ms;cursor:pointer}
.sidebar a:hover{background:rgba(250,246,239,.06);color:var(--bg)}
.sidebar a.active{background:var(--purple);color:var(--bg)}
.sidebar a.active .ico{background:var(--orange);color:#fff}
.sidebar a .ico{width:24px;height:24px;border-radius:6px;background:rgba(250,246,239,.08);color:var(--bg);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:600;transition:all 140ms}
.sidebar a .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:rgba(250,246,239,.5)}
.sidebar a.active .count{color:var(--bg)}
.sidebar-user{margin-top:auto;padding:14px 12px;border-top:1px solid rgba(250,246,239,.1);display:flex;align-items:center;gap:12px;font-size:13px}
.sidebar-user .avatar{width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:12px}
.sidebar-user .name{color:var(--bg)}
.sidebar-user .role{font-size:11px;color:rgba(250,246,239,.5);font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.main{min-height:100vh;overflow-x:hidden}
.page-header{padding:36px 48px 28px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.page-header .eyebrow{margin-bottom:10px}
.page-header h1{font-family:var(--font-display);font-size:44px;letter-spacing:-.025em;line-height:1;font-weight:500}
.page-header h1 em{font-style:italic;color:var(--purple);font-weight:400}
.page-header .subtitle{margin-top:8px;color:var(--ink-soft);font-size:15px}
.page-actions{display:flex;gap:10px;align-items:center}
.page-body{padding:36px 48px 80px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.search{flex:1;min-width:260px;padding:10px 14px;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--bg);font-size:14px;display:flex;align-items:center;gap:10px}
.search::before{content:"⌕";color:var(--ink-muted);font-size:16px}
.search input{border:none;outline:none;flex:1;background:transparent}
.chip{padding:6px 14px;border-radius:999px;background:var(--bg-tint);color:var(--ink);font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid transparent;transition:all 140ms}
.chip:hover{border-color:var(--rule)}
.chip.active{background:var(--purple);color:var(--bg)}
.card{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--bg);padding:22px}
.card h3{font-family:var(--font-display);font-size:20px;font-weight:500;margin-bottom:4px;letter-spacing:-.015em}
.card h3 em{font-style:italic;color:var(--purple);font-weight:400}
.card-sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.kpi{padding:22px 24px;border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--bg);position:relative;overflow:hidden}
.kpi-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.kpi-value{font-family:var(--font-display);font-size:42px;font-weight:500;letter-spacing:-.02em;margin-top:8px;line-height:1}
.kpi-value em{color:var(--purple);font-style:italic;font-weight:400}
.kpi-delta{margin-top:10px;font-size:12px;font-family:var(--font-mono);color:var(--ink-muted);letter-spacing:.06em;text-transform:uppercase}
.kpi-accent{border-top:3px solid var(--purple)}
.kpi-accent-orange{border-top:3px solid var(--orange)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table thead th{text-align:left;padding:12px 16px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);font-weight:500;border-bottom:1px solid var(--rule);background:var(--bg-tint)}
.table tbody td{padding:14px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
.table tbody tr:hover{background:var(--bg-tint);cursor:pointer}
.table tbody tr:last-child td{border-bottom:none}
.table .lead{font-weight:500;color:var(--ink)}
.table .sub{font-size:12px;color:var(--ink-muted);margin-top:2px}
.avatar-sm{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--purple);color:var(--bg);font-family:var(--font-mono);font-weight:600;font-size:11px;margin-right:10px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.pill::before{content:"●";font-size:9px}
.pill-open{background:#e3f1ea;color:var(--success)}
.pill-full{background:var(--orange-soft);color:var(--orange-deep)}
.pill-plan{background:var(--purple-soft);color:var(--purple)}
.pill-done{background:var(--bg-tint);color:var(--ink-muted)}
.pill-cancel{background:#fbe5e1;color:var(--danger)}
.pill-avail{background:#e3f1ea;color:var(--success)}
.pill-out{background:var(--orange-soft);color:var(--orange-deep)}
.pill-maint{background:#f4ebd8;color:#a67c1c}
.cap-bar{display:flex;align-items:center;gap:10px}
.cap-bar-track{flex:1;height:6px;background:var(--bg-tint);border-radius:99px;overflow:hidden;max-width:140px}
.cap-bar-fill{height:100%;background:var(--purple);border-radius:99px;transition:width 240ms}
.cap-bar-fill.full{background:var(--orange)}
.cap-bar-text{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);letter-spacing:.06em}
.today-ribbon{background:var(--purple);color:var(--bg);padding:24px 28px;border-radius:var(--r-lg);display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:28px;position:relative;overflow:hidden}
.today-ribbon::after{content:"";position:absolute;top:-80px;right:-80px;width:240px;height:240px;border-radius:50%;background:var(--orange);opacity:.9}
.today-ribbon .content{position:relative;z-index:1}
.today-ribbon .label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,246,239,.7)}
.today-ribbon h2{font-family:var(--font-display);font-size:32px;font-weight:500;letter-spacing:-.02em;margin-top:8px}
.today-ribbon h2 em{font-style:italic;font-weight:400}
.today-ribbon .meta{margin-top:10px;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:rgba(250,246,239,.85)}
.today-ribbon .actions{position:relative;z-index:1;display:flex;gap:10px}
.today-ribbon .btn{background:var(--bg);color:var(--purple);padding:10px 16px}
.empty{padding:60px 20px;text-align:center;color:var(--ink-muted);font-size:14px;border:1px dashed var(--rule);border-radius:var(--r-lg)}
.signin{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--bg)}
.signin-visual{background:var(--purple);color:var(--bg);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.signin-visual::after{content:"";position:absolute;bottom:-140px;right:-140px;width:440px;height:440px;border-radius:50%;background:var(--orange);opacity:.9}
.signin-visual .content{position:relative;z-index:1}
.signin-visual h1{font-family:var(--font-display);font-size:64px;letter-spacing:-.03em;line-height:.95;font-weight:500;margin-top:40px}
.signin-visual h1 em{font-style:italic;color:var(--orange);font-weight:400}
.signin-visual .lead{font-size:17px;color:rgba(250,246,239,.85);margin-top:20px;max-width:440px}
.signin-visual .quote{position:relative;z-index:1;font-family:var(--font-display);font-style:italic;font-size:18px;border-left:2px solid var(--orange);padding-left:18px;opacity:.9;max-width:360px}
.signin-visual .quote cite{display:block;font-family:var(--font-mono);font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:10px;opacity:.7}
.signin-form-wrap{display:flex;align-items:center;justify-content:center;padding:48px}
.signin-form{width:100%;max-width:400px}
.signin-form h2{font-family:var(--font-display);font-size:36px;letter-spacing:-.02em;line-height:1.05;font-weight:500;margin-bottom:8px}
.signin-form h2 em{font-style:italic;color:var(--purple);font-weight:400}
.signin-form .lead{color:var(--ink-soft);margin-bottom:30px}
.signin-links{margin-top:24px;padding-top:24px;border-top:1px solid var(--rule)}
.signin-links h5{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:12px}
/* Upload zone */
.upload-zone{border:2px dashed var(--rule);border-radius:var(--r-lg);padding:48px;text-align:center;cursor:pointer;transition:all 200ms;background:var(--bg-tint)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--purple);background:var(--purple-soft)}
.upload-zone input{display:none}
.upload-icon{font-size:36px;margin-bottom:12px}
.upload-text{font-family:var(--font-display);font-size:22px;font-weight:500;margin-bottom:6px}
.upload-sub{font-size:13px;color:var(--ink-muted);font-family:var(--font-mono);letter-spacing:.06em}
.result-banner{border-radius:var(--r-md);padding:16px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;font-size:14px}
.result-banner.success{background:#e3f1ea;border:1px solid #b8dfc8;color:var(--success)}
.result-banner.error{background:#fbe5e1;border:1px solid #f0b8b0;color:var(--danger)}
/* Status select */
select.status-sel{background:var(--bg);border:1px solid var(--rule);border-radius:var(--r-sm);color:var(--ink);padding:4px 28px 4px 8px;font-size:12px;font-family:var(--font-mono);letter-spacing:.06em;width:auto}
/* Error state */
.error-msg{background:#fbe5e1;color:var(--danger);padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:16px}
/* Log error modal */
.log-modal-backdrop{position:fixed;inset:0;background:rgba(26,14,46,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px}
.log-modal{background:var(--bg);border-radius:var(--r-xl);padding:32px;max-width:620px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:20px;box-shadow:0 24px 64px rgba(0,0,0,0.3)}
.log-modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.log-modal-close{font-size:22px;line-height:1;color:var(--ink-muted);padding:4px;border-radius:var(--r-sm);transition:color 140ms}
.log-modal-close:hover{color:var(--ink)}
.log-modal-errors{overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.log-error-row{background:var(--bg-tint);border-radius:var(--r-md);padding:12px 16px;border-left:3px solid var(--danger)}
.log-error-row .row-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:5px}
.log-error-row .row-msg{font-size:14px;color:var(--ink);line-height:1.5}
.log-clickable{cursor:pointer}
.log-clickable:hover .pill-full{background:var(--orange-deep);color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API_BASE = '';

// ── API helper ─────────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('mb_token'); }
async function api(method, path, body, isForm) {
  const opts = { method, headers: { Authorization: `Bearer ${getToken()}` } };
  if (isForm) { opts.body = body; }
  else if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(API_BASE + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// ── Sign In ────────────────────────────────────────────────────────────────
function SignIn({ onSignIn }) {
  const [email, setEmail] = useState('priya@evansville.edu');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setErr(''); setLoading(true);
    try {
      const { token, user } = await api('POST', '/api/auth/login', { email, password });
      localStorage.setItem('mb_token', token);
      localStorage.setItem('mb_user', JSON.stringify(user));
      onSignIn(user);
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  return (
    <div className="signin">
      <aside className="signin-visual">
        <div className="content">
          <div style={{display:'flex',alignItems:'center',gap:12,fontFamily:'var(--font-display)',fontSize:22}}>
            <span style={{width:34,height:34,borderRadius:8,background:'var(--bg)',color:'var(--purple)',display:'grid',placeItems:'center',fontFamily:'var(--font-mono)',fontWeight:600,fontSize:14}}>M</span>
            MakerBase
          </div>
          <h1>The ChangeLab<br/><em>operations hub.</em></h1>
          <p className="lead">Track camps, manage equipment, log sessions, import spreadsheets. Built for staff.</p>
        </div>
        <div className="quote">
          If it happened in the lab, it lives in MakerBase.
          <cite>— Shop convention, since 2024</cite>
        </div>
      </aside>
      <div className="signin-form-wrap">
        <form className="signin-form" onSubmit={submit}>
          <div className="eyebrow" style={{marginBottom:14}}><span className="dot"></span>Staff sign-in</div>
          <h2>Welcome <em>back.</em></h2>
          <p className="lead">Use your UE staff credentials.</p>
          {err && <div className="error-msg">{err}</div>}
          <div className="field"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required /></div>
          <div className="field"><label>Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required /></div>
          <button type="submit" className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} disabled={loading}>
            {loading ? 'Signing in…' : 'Sign in →'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function Sidebar({ view, setView, user, onSignOut }) {
  const groups = [
    { group:'Overview', items:[{ id:'home', label:'Today', ico:'◆' }]},
    { group:'Import', items:[{ id:'import', label:'Import data', ico:'↓' }, { id:'logs', label:'Import logs', ico:'≡' }]},
    { group:'Programs', items:[
      { id:'camps', label:'Dance Camp', ico:'C' },
      { id:'changelabs', label:'ChangeLabs', ico:'✦' },
    ]},
    { group:'People & gear', items:[
      { id:'members', label:'Members', ico:'M' },
      { id:'equipment', label:'Equipment', ico:'E' },
      { id:'partners', label:'Partners', ico:'P' },
    ]},
  ];
  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <span className="mark">M</span>
        MakerBase
      </div>
      {groups.map(g => (
        <React.Fragment key={g.group}>
          <div className="sidebar-section">{g.group}</div>
          {g.items.map(it => (
            <a key={it.id} className={view===it.id?'active':''} onClick={()=>setView(it.id)}>
              <span className="ico">{it.ico}</span>
              <span>{it.label}</span>
            </a>
          ))}
        </React.Fragment>
      ))}
      <div className="sidebar-user">
        <span className="avatar">{user?.initials || '?'}</span>
        <div>
          <div className="name">{user?.name}</div>
          <div className="role">{user?.role}</div>
        </div>
        <button onClick={onSignOut} style={{marginLeft:'auto',color:'rgba(250,246,239,.4)',fontSize:18}} title="Sign out">↩</button>
      </div>
    </aside>
  );
}

// ── Today / Home ────────────────────────────────────────────────────────────
function PageToday({ setView, user }) {
  const [stats, setStats] = useState(null);

  useEffect(() => {
    Promise.all([
      api('GET', '/api/import/roster/dance_camp').catch(()=>[]),
      api('GET', '/api/members').catch(()=>[]),
      api('GET', '/api/equipment').catch(()=>[]),
      api('GET', '/api/changelabs').catch(()=>[]),
      api('GET', '/api/import/logs').catch(()=>[]),
    ]).then(([campers, members, equip, labs, logs]) => {
      setStats({
        campers: campers.length,
        confirmed: campers.filter(c=>c.status==='confirmed').length,
        members: members.length,
        activeMembers: members.filter(m=>m.status==='active').length,
        equipOut: equip.filter(e=>e.status==='checked_out').length,
        equip: equip.length,
        activeLabs: labs.filter(l=>l.status==='in_progress').length,
        labs: labs.length,
        imports: logs.length,
      });
    });
  }, []);

  const now = new Date();
  const greeting = now.getHours() < 12 ? 'morning' : now.getHours() < 17 ? 'afternoon' : 'evening';
  const firstName = user?.name?.split(' ')[0] || 'there';

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="eyebrow"><span className="dot"></span>{now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
          <h1>Good {greeting}, <em>{firstName}.</em></h1>

// ── Import ─────────────────────────────────────────────────────────────────
function PageImport() {
  const [file, setFile] = useState(null);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [drag, setDrag] = useState(false);

  function handleFile(f) {
    if (!f) return;
    setFile(f); setResult(null);
  }

  async function doImport() {
    if (!file) return;
    setLoading(true);
    try {
      // Refresh token before a potentially long import so it doesn't expire mid-request
      try {
        const refreshed = await api('POST', '/api/auth/refresh');
        localStorage.setItem('mb_token', refreshed.token);
      } catch (_) {
        // If refresh fails (already expired) the import will fail with a clear error
      }
      const form = new FormData();
      form.append('file', file);
      const r = await api('POST', '/api/import', form, true);
      setResult({ ok: true, ...r });
      setFile(null);
    } catch (e) {
      setResult({ ok: false, error: e.message });
    }
    setLoading(false);
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="eyebrow"><span className="dot"></span>Data entry</div>
          <h1>Import <em>data.</em></h1>
          <p className="subtitle">Drop any spreadsheet — the system detects the type automatically.</p>
        </div>
      </div>
      <div className="page-body">
        {result && (
          <div className={`result-banner ${result.ok?'success':'error'}`}>
            <span>{result.ok ? '✓' : '✕'}</span>
            <div>
              {result.ok
                ? <><strong>Imported successfully</strong> — detected as <strong>{result.type}</strong>. {result.rows_imported} rows imported, {result.rows_skipped} skipped.{result.errors?.length ? ` ${result.errors.length} row(s) had errors.` : ''}</>
                : <><strong>Import failed</strong> — {result.error}</>
              }
            </div>
          </div>
        )}

        {file ? (
          <div className="card" style={{marginBottom:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div>
                <div className="card-sub">Ready to import</div>
                <h3 style={{marginTop:6}}>{file.name}</h3>
                <p style={{marginTop:4,color:'var(--ink-soft)',fontSize:13}}>{(file.size/1024).toFixed(1)} KB</p>
              </div>
              <div style={{display:'flex',gap:10}}>
                <button className="btn btn-soft" onClick={()=>setFile(null)}>Cancel</button>
                <button className="btn btn-primary" onClick={doImport} disabled={loading}>
                  {loading ? 'Importing…' : '✓ Confirm import'}
                </button>
              </div>
            </div>
          </div>
        ) : (
          <div
            className={`upload-zone ${drag?'drag':''}`}
            onDragOver={e=>{e.preventDefault();setDrag(true)}}
            onDragLeave={()=>setDrag(false)}
            onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}}
            onClick={()=>document.getElementById('file-input').click()}
          >
            <input id="file-input" type="file" accept=".xlsx,.xls,.csv" onChange={e=>handleFile(e.target.files[0])} />
            <div className="upload-icon">📊</div>
            <div className="upload-text">Drop a spreadsheet here</div>
            <div className="upload-sub" style={{marginTop:6}}>or click to browse · .xlsx · .xls · .csv · max 10 MB</div>
          </div>
        )}

        <div className="card" style={{marginTop:24}}>
          <div className="card-sub" style={{marginBottom:14}}>Supported sheet types — auto-detected from column headers</div>
          <table className="table">
            <thead><tr><th>Type</th><th>Required columns</th><th>Destination</th></tr></thead>
            <tbody>
              <tr><td className="lead">Dance Camp</td><td>Full Name, Parent/Guardian Name, Emergency Contact Name</td><td>dance_camp_campers</td></tr>
              <tr><td className="lead">Members</td><td>Name, Major, Joined</td><td>members</td></tr>
              <tr><td className="lead">ChangeLab Roster</td><td>First Name, Last Name, Project, Semester</td><td>changelab_roster</td></tr>
              <tr><td className="lead">Equipment</td><td>Name, Category, Serial, Location</td><td>equipment</td></tr>
              <tr><td className="lead">Partners</td><td>Name, Kind, Contact, MOU Status</td><td>partners</td></tr>
              <tr><td className="lead">Certifications</td><td>Name, Valid Days</td><td>certifications</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Dance Camp Roster ───────────────────────────────────────────────────────
function PageCamps() {
  const [campers, setCampers] = useState(null);
  const [filter, setFilter] = useState('all');
  const [q, setQ] = useState('');
  const [selectedCamper, setSelectedCamper] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [editForm, setEditForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [canEdit, setCanEdit] = useState(false);

  // Get logged-in user from localStorage
  const currentUser = React.useMemo(() => {
    try { return JSON.parse(localStorage.getItem('mb_user')); } catch { return null; }
  }, []);
  const isAdmin = currentUser?.role === 'admin';

  const load = useCallback(() => {
    api('GET', '/api/import/roster/dance_camp').then(setCampers).catch(() => setCampers([]));
  }, []);

  useEffect(load, [load]);

  // Check if current user can edit this camp
  useEffect(() => {
    if (isAdmin) { setCanEdit(true); return; }
    api('GET', '/api/import/dance-camp/staff')
      .then(staff => setCanEdit(staff.some(s => s.id === currentUser?.id)))
      .catch(() => setCanEdit(false));
  }, [isAdmin, currentUser]);

  async function updateStatus(id, status) {
    await api('PATCH', `/api/import/dance-camp/${id}`, { status });
    load();
  }

  function openEdit(camper) {
    setEditForm({
      // Admin-only
      full_name: camper.full_name || '',
      dob: camper.dob ? camper.dob.slice(0, 10) : '',
      age_at_camp: camper.age_at_camp || '',
      race: camper.race || '',
      discount_code: camper.discount_code || '',
      // Staff-editable
      preferred_name: camper.preferred_name || '',
      school: camper.school || '',
      grade: camper.grade || '',
      shirt_size: camper.shirt_size || '',
      transportation_needed: camper.transportation_needed || '',
      status: camper.status || 'applied',
      medical_conditions: camper.medical_conditions || '',
      medication_required: camper.medication_required || '',
      food_restrictions: camper.food_restrictions || '',
      known_medical_issues: camper.known_medical_issues || '',
      // Guardian
      guardian_name: camper.guardian_name || '',
      guardian_relationship: camper.guardian_relationship || '',
      guardian_address: camper.guardian_address || '',
      guardian_city_state_zip: camper.guardian_city_state_zip || '',
      guardian_email: camper.guardian_email || '',
      guardian_phone: camper.guardian_phone || '',
      guardian_work_phone: camper.guardian_work_phone || '',
      // Emergency contact
      ec_name: camper.emergency_contact || '',
      ec_phone: camper.ec_phone || '',
      ec_relationship: camper.ec_relationship || '',
    });
    setEditMode(true);
  }

  async function saveEdit() {
    setSaving(true);
    try {
      const updated = await api('PATCH', `/api/import/dance-camp/${selectedCamper.id}/full`, editForm);
      setSelectedCamper(updated);
      setEditMode(false);
      load();
    } catch(e) {
      alert('Save failed: ' + e.message);
    } finally {
      setSaving(false);
    }
  }

  function cancelEdit() {
    setEditMode(false);
    setEditForm({});
  }

  const ef = (field) => ({
    value: editForm[field] ?? '',
    onChange: e => setEditForm(f => ({ ...f, [field]: e.target.value })),
  });

  const filtered = (campers || [])
    .filter(c => {
      if (filter !== 'all' && c.status !== filter) return false;
      if (q && !c.full_name.toLowerCase().includes(q.toLowerCase())) return false;
      return true;
    })
    .sort((a, b) => {
      const sa = (a.school || '').toLowerCase();
      const sb = (b.school || '').toLowerCase();
      if (sa < sb) return -1;
      if (sa > sb) return 1;
      return (a.full_name || '').localeCompare(b.full_name || '');
    });

  const counts = (campers||[]).reduce((a,c) => { a[c.status]=(a[c.status]||0)+1; return a; }, {});

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="eyebrow"><span className="dot"></span>Programs</div>
          <h1>Dance Camp <em>2026.</em></h1>
          <p className="subtitle">Manage signups, confirm attendance, track medical notes.</p>
        </div>
        <div className="page-actions">
          <button className="btn btn-soft" onClick={load}>↺ Refresh</button>
        </div>
      </div>
      <div className="page-body">
        {campers === null ? <div className="empty">Loading…</div> : (
          <>
            <div className="kpi-row">
              <div className="kpi kpi-accent"><div className="kpi-label">Total signups</div><div className="kpi-value"><em>{campers.length}</em></div></div>
              <div className="kpi"><div className="kpi-label">Confirmed</div><div className="kpi-value" style={{color:'var(--success)'}}>{counts.confirmed||0}</div></div>
              <div className="kpi"><div className="kpi-label">Applied</div><div className="kpi-value">{counts.applied||0}</div></div>
              <div className="kpi"><div className="kpi-label">Cancelled</div><div className="kpi-value" style={{color:'var(--danger)'}}>{counts.cancelled||0}</div></div>
            </div>

            {campers.length === 0 ? (
              <div className="empty">No campers yet — import the signup spreadsheet first.</div>
            ) : (
              <>
                <div className="toolbar">
                  <div className="search"><input placeholder="Search by name…" value={q} onChange={e=>setQ(e.target.value)} /></div>
                  {['all','applied','confirmed','waitlist','cancelled'].map(f=>(
                    <button key={f} className={`chip ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</button>
                  ))}
                </div>
                <table className="table">
                  <thead><tr>
                    <th>Name</th><th>Age</th><th>School</th><th>Shirt</th>
                    <th>Guardian</th><th>Guardian phone</th>
                    <th>Emergency contact</th><th>Medical</th><th>Status</th>
                  </tr></thead>
                  <tbody>
                    {filtered.map(c => (
                      <tr key={c.id} onClick={e => { if (e.target.tagName !== 'SELECT') { setSelectedCamper(c); setEditMode(false); } }} style={{cursor:'pointer'}}>
                        <td>
                          <div className="lead">{c.full_name}</div>
                          {c.preferred_name && c.preferred_name !== c.full_name && <div className="sub">goes by {c.preferred_name}</div>}
                        </td>
                        <td>{c.age_at_camp || '—'}</td>
                        <td>{c.school || '—'}</td>
                        <td><span style={{fontFamily:'var(--font-mono)',fontSize:12}}>{c.shirt_size || '—'}</span></td>
                        <td><div className="lead">{c.guardian_name || '—'}</div></td>
                        <td>{c.guardian_phone || '—'}</td>
                        <td>
                          <div className="lead">{c.emergency_contact || '—'}</div>
                          {c.ec_phone && <div className="sub">{c.ec_phone}</div>}
                        </td>
                        <td>
                          {(c.medical_conditions || c.food_restrictions || c.known_medical_issues)
                            ? <span className="pill pill-full" title={[c.medical_conditions, c.food_restrictions, c.known_medical_issues].filter(Boolean).join(' / ')}>⚠ Has notes</span>
                            : <span className="pill pill-open">None</span>
                          }
                        </td>
                        <td>
                          <select className="status-sel" value={c.status} onChange={e=>updateStatus(c.id, e.target.value)}>
                            <option value="applied">applied</option>
                            <option value="confirmed">confirmed</option>
                            <option value="waitlist">waitlist</option>
                            <option value="cancelled">cancelled</option>
                          </select>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </>
            )}
          </>
        )}
      </div>

      {/* ── Camper detail / edit modal ── */}
      {selectedCamper && (
        <div className="log-modal-backdrop" onClick={() => { setSelectedCamper(null); setEditMode(false); }}>
          <div className="log-modal" style={{maxWidth:720}} onClick={e => e.stopPropagation()}>

            {/* Header */}
            <div className="log-modal-header">
              <div>
                <div className="eyebrow" style={{marginBottom:8}}>
                  <span className="dot"></span>{editMode ? 'Editing camper' : 'Camper profile'}
                </div>
                {editMode && isAdmin
                  ? <input {...ef('full_name')} style={{fontFamily:'var(--font-display)',fontSize:24,fontWeight:500,border:'none',borderBottom:'2px solid var(--purple)',background:'transparent',outline:'none',width:'100%'}} />
                  : <h2 style={{fontFamily:'var(--font-display)',fontSize:26,fontWeight:500,letterSpacing:'-.015em'}}>{selectedCamper.full_name}</h2>
                }
                {!editMode && selectedCamper.preferred_name && selectedCamper.preferred_name !== selectedCamper.full_name &&
                  <p style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--ink-muted)',marginTop:4}}>goes by {selectedCamper.preferred_name}</p>
                }
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
                {canEdit && !editMode && (
                  <button className="btn btn-soft" style={{padding:'8px 16px',fontSize:13}} onClick={() => openEdit(selectedCamper)}>
                    ✎ Edit
                  </button>
                )}
                <button className="log-modal-close" onClick={() => { setSelectedCamper(null); setEditMode(false); }}>✕</button>
              </div>
            </div>

            {/* Body */}
            <div style={{overflowY:'auto',maxHeight:'60vh',display:'flex',flexDirection:'column',gap:0}}>

              {/* Basic info */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
                <EditOrView label="Preferred name" value={selectedCamper.preferred_name} editMode={editMode} input={<input {...ef('preferred_name')} style={inputStyle} />} />
                <EditOrView label="School" value={selectedCamper.school} editMode={editMode} input={<input {...ef('school')} style={inputStyle} />} />
                <EditOrView label="Grade" value={selectedCamper.grade} editMode={editMode} input={<input {...ef('grade')} style={inputStyle} />} />
                <EditOrView label="Shirt size" value={selectedCamper.shirt_size} editMode={editMode} input={
                  <select {...ef('shirt_size')} style={inputStyle}>
                    {['','XS','S','M','L','XL','XXL'].map(s => <option key={s} value={s}>{s||'—'}</option>)}
                  </select>
                } />
                <EditOrView label="Transportation needed" value={selectedCamper.transportation_needed} editMode={editMode} input={<input {...ef('transportation_needed')} style={inputStyle} />} />
                <EditOrView label="Status" value={selectedCamper.status} editMode={editMode} input={
                  <select {...ef('status')} style={inputStyle}>
                    {['applied','confirmed','waitlist','cancelled'].map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                } />

                {/* Admin-only fields */}
                {(isAdmin || !editMode) && <>
                  <EditOrView label="Age at camp" value={selectedCamper.age_at_camp} editMode={editMode && isAdmin} input={<input type="number" {...ef('age_at_camp')} style={inputStyle} />} adminOnly={!isAdmin} />
                  <EditOrView label="Date of birth" value={selectedCamper.dob ? new Date(selectedCamper.dob).toLocaleDateString() : null} editMode={editMode && isAdmin} input={<input type="date" {...ef('dob')} style={inputStyle} />} adminOnly={!isAdmin} />
                  <EditOrView label="Race" value={selectedCamper.race} editMode={editMode && isAdmin} input={<input {...ef('race')} style={inputStyle} />} adminOnly={!isAdmin} />
                  <EditOrView label="Discount code" value={selectedCamper.discount_code} editMode={editMode && isAdmin} input={<input {...ef('discount_code')} style={inputStyle} />} adminOnly={!isAdmin} />
                </>}
              </div>

              {/* Guardian */}
              <div style={{borderTop:'1px solid var(--rule)',paddingTop:14,marginBottom:14}}>
                <div className="card-sub" style={{marginBottom:10}}>Parent / Guardian</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                  <EditOrView label="Name" value={selectedCamper.guardian_name} editMode={editMode} input={<input {...ef('guardian_name')} style={inputStyle} />} />
                  <EditOrView label="Relationship" value={selectedCamper.guardian_relationship} editMode={editMode} input={<input {...ef('guardian_relationship')} style={inputStyle} />} />
                  <EditOrView label="Cell phone" value={selectedCamper.guardian_phone} editMode={editMode} input={<input {...ef('guardian_phone')} style={inputStyle} />} />
                  <EditOrView label="Work phone" value={selectedCamper.guardian_work_phone} editMode={editMode} input={<input {...ef('guardian_work_phone')} style={inputStyle} />} />
                  <EditOrView label="Email" value={selectedCamper.guardian_email} editMode={editMode} input={<input {...ef('guardian_email')} style={inputStyle} />} />
                  <EditOrView label="Address" value={selectedCamper.guardian_address} editMode={editMode} input={<input {...ef('guardian_address')} style={inputStyle} />} />
                  <EditOrView label="City / State / Zip" value={selectedCamper.guardian_city_state_zip} editMode={editMode} input={<input {...ef('guardian_city_state_zip')} style={inputStyle} />} />

              <div style={{borderTop:'1px solid var(--rule)',paddingTop:14,marginBottom:14}}>
                <div className="card-sub" style={{marginBottom:10}}>Emergency Contact</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                  <EditOrView label="Name" value={selectedCamper.emergency_contact} editMode={editMode} input={<input {...ef('ec_name')} style={inputStyle} />} />
                  <EditOrView label="Phone" value={selectedCamper.ec_phone} editMode={editMode} input={<input {...ef('ec_phone')} style={inputStyle} />} />
                  <EditOrView label="Relationship" value={selectedCamper.ec_relationship} editMode={editMode} input={<input {...ef('ec_relationship')} style={inputStyle} />} />

              </div>

              {/* Medical notes */}
              <div style={{borderTop:'1px solid var(--rule)',paddingTop:14}}>
                <div className="card-sub" style={{marginBottom:10}}>Medical &amp; Dietary Notes</div>
                {editMode ? (
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    <EditOrView label="Medical conditions / allergies" value={selectedCamper.medical_conditions} editMode={true} input={<textarea {...ef('medical_conditions')} style={{...inputStyle,height:60,resize:'vertical'}} />} />
                    <EditOrView label="Medication required" value={selectedCamper.medication_required} editMode={true} input={<textarea {...ef('medication_required')} style={{...inputStyle,height:60,resize:'vertical'}} />} />
                    <EditOrView label="Food restrictions" value={selectedCamper.food_restrictions} editMode={true} input={<textarea {...ef('food_restrictions')} style={{...inputStyle,height:60,resize:'vertical'}} />} />
                    <EditOrView label="Known medical issues" value={selectedCamper.known_medical_issues} editMode={true} input={<textarea {...ef('known_medical_issues')} style={{...inputStyle,height:60,resize:'vertical'}} />} />
                  </div>

                  !selectedCamper.medical_conditions && !selectedCamper.medication_required && !selectedCamper.food_restrictions && !selectedCamper.known_medical_issues
                    ? <p style={{fontSize:14,color:'var(--ink-muted)'}}>No notes on file.</p>
                    : <div style={{display:'flex',flexDirection:'column',gap:10}}>
                        {selectedCamper.medical_conditions && <NoteBlock label="Medical conditions / allergies" value={selectedCamper.medical_conditions} />}
                        {selectedCamper.medication_required && <NoteBlock label="Medication required" value={selectedCamper.medication_required} />}
                        {selectedCamper.food_restrictions && <NoteBlock label="Food restrictions" value={selectedCamper.food_restrictions} />}
                        {selectedCamper.known_medical_issues && <NoteBlock label="Known medical issues" value={selectedCamper.known_medical_issues} />}
                      </div>
                )}
              </div>
            </div>

            {/* Footer */}
            <div style={{display:'flex',justifyContent:'flex-end',gap:10,paddingTop:16,borderTop:'1px solid var(--rule)',marginTop:4}}>
              {editMode ? (
                <>
                  <button className="btn btn-soft" onClick={cancelEdit} disabled={saving}>Cancel</button>
                  <button className="btn btn-primary" onClick={saveEdit} disabled={saving}>
                    {saving ? 'Saving…' : '✓ Save changes'}
                  </button>
                </>
              ) : (
                <button className="btn btn-soft" onClick={() => setSelectedCamper(null)}>Close</button>
              )}
            </div>
          </div>

// Helper: compute semester progress from today's date
function useSemesterProgress(semCode, semesters) {
  if (!semCode || !semesters) return null;
  const sem = semesters.find(s => s.code === semCode);
  if (!sem) return null;

  const today = new Date();
  const start = new Date(sem.start_date);
  const end   = new Date(sem.end_date);
  const finals = sem.finals_start ? new Date(sem.finals_start) : null;

  if (today < start) return { phase: 'pre', pct: 0, label: 'Not started', sem };
  if (today > end)   return { phase: 'done', pct: 100, label: 'Completed', sem };

  const total = end - start;
  const elapsed = today - start;
  const pct = Math.round((elapsed / total) * 100);

  // Calculate week number (excluding breaks)
  const msPerWeek = 7 * 24 * 3600 * 1000;
  const totalWeeks = Math.round(total / msPerWeek);
  const elapsedWeeks = Math.round(elapsed / msPerWeek);

  let phase = 'active';
  let label = `Week ${elapsedWeeks} of ${totalWeeks}`;

  if (finals && today >= finals) {
    phase = 'finals';
    label = 'Finals week';
  } else if (sem.spring_break_start && today >= new Date(sem.spring_break_start) && today <= new Date(sem.spring_break_end)) {
    phase = 'break';
    label = 'Spring break';
  } else if (sem.fall_break_start && today >= new Date(sem.fall_break_start) && today <= new Date(sem.fall_break_end)) {
    phase = 'break';
    label = 'Fall break';
  } else if (sem.midterm_date) {
    const midterm = new Date(sem.midterm_date);
    if (today < midterm) label = `Week ${elapsedWeeks} of ${totalWeeks} · pre-midterm`;
    else label = `Week ${elapsedWeeks} of ${totalWeeks} · post-midterm`;
  }

  return { phase, pct, label, sem, elapsedWeeks, totalWeeks };
}

function SemesterProgressBar({ progress }) {
  if (!progress) return null;
  const colors = {
    pre: 'var(--ink-muted)',
    active: 'var(--purple)',
    break: 'var(--gold)',
    finals: 'var(--orange)',
    done: 'var(--success)',
  };
  const color = colors[progress.phase] || 'var(--purple)';
  return (

  const currentUser = React.useMemo(() => {
    try { return JSON.parse(localStorage.getItem('mb_user')); } catch { return null; }
  }, []);
  const isAdmin = currentUser?.role === 'admin';

    api('GET', '/api/changelabs').then(setLabs).catch(() => setLabs([]));
    api('GET', '/api/changelabs/semesters/all').then(setSemesters).catch(() => setSemesters([]));
  }, []);

  async function openLab(lab) {
    setSelectedLab(lab);
    setRoster(null); setMilestones(null);
    setRosterLoading(true); setMilestonesLoading(true);

    try {
      const r = await api('GET', `/api/changelabs/${lab.id}/roster`);
      setRoster(r);
    } catch { setRoster([]); }
    finally { setRosterLoading(false); }

    try {
      const semCode = encodeURIComponent(lab.semester);
      const m = await api('GET', `/api/changelabs/semesters/${semCode}/milestones?lab_id=${lab.id}`);
      setMilestones(m);
    } catch { setMilestones([]); }
    finally { setMilestonesLoading(false); }
  }

  async function toggleMilestone(milestoneId) {
    if (!isAdmin || !selectedLab) return;
    try {
      const r = await api('POST', `/api/changelabs/milestones/${milestoneId}/complete`, { changelab_id: selectedLab.id });
      // Refresh milestones
      const semCode = encodeURIComponent(selectedLab.semester);
      const m = await api('GET', `/api/changelabs/semesters/${semCode}/milestones?lab_id=${selectedLab.id}`);
      setMilestones(m);
      // Update progress on lab
      const done = m.filter(x => x.completed).length;
      const pct = m.length ? Math.round((done / m.length) * 100) : 0;
      await api('PATCH', `/api/changelabs/${selectedLab.id}`, { progress: pct });
      setSelectedLab(l => ({ ...l, progress: pct }));
      setLabs(ls => ls.map(l => l.id === selectedLab.id ? { ...l, progress: pct } : l));
    } catch(e) { alert('Failed: ' + e.message); }
  }

    if (!newMilestone.title || !newMilestone.due_date) return;
    setSaving(true);

                                </div>
                                <div style={{height:4,background:'var(--bg-tint)',borderRadius:99,overflow:'hidden'}}>
                                  <div style={{height:'100%',width:lab.progress+'%',background:'var(--purple)',borderRadius:99}} />
                                </div>
                              </div>
                            )}
                            {/* Semester progress bar for active labs */}
                            {semProgress && semProgress.phase !== 'done' && semProgress.phase !== 'pre' && lab.status === 'in_progress' && (
                              <SemesterProgressBar progress={semProgress} />
                            )}
                            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:10,paddingTop:10,borderTop:'1px solid var(--rule)'}}>
                              <div className="cap-bar-track" style={{maxWidth:80}}>
                                <div className="cap-bar-fill" style={{width:Math.min(100,(lab.enrolled/Math.max(lab.capacity,1)*100))+'%'}}></div>
                              </div>
                              <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--ink-muted)'}}>{lab.enrolled||0}/{lab.capacity||0}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <table className="table">
                <thead><tr>
                  <th>Name</th><th>Semester</th><th>Instructor</th><th>Students</th><th>Progress</th><th>Status</th>
                </tr></thead>
                <tbody>
                  {filtered.map(lab => {
                    const sp = useSemesterProgress(lab.semester, semList);
                    return (
                      <tr key={lab.id} onClick={() => openLab(lab)} style={{cursor:'pointer'}}>
                        <td className="lead">{lab.title}</td>
                        <td style={{fontFamily:'var(--font-mono)',fontSize:12}}>{lab.semester}</td>
                        <td style={{fontSize:13,color:'var(--ink-soft)'}}>
                          {lab.brief?.startsWith('Instructor:') ? lab.brief.split('·')[0].replace('Instructor: ','').trim() : '—'}
                        </td>
                        <td style={{fontFamily:'var(--font-mono)',fontSize:12}}>{lab.enrolled||0}</td>
                        <td>
                          {sp && sp.phase !== 'done' && sp.phase !== 'pre' && lab.status === 'in_progress'
                            ? <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--purple)'}}>{sp.label}</span>
                            : lab.progress > 0
                              ? <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--ink-muted)'}}>{lab.progress}%</span>
                              : '—'
                          }
                        </td>
                        <td>{statusPill(lab.status)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </>
        )}
      </div>

      {/* ── ChangeLab detail modal ── */}
      {selectedLab && (() => {
        const semProgress = useSemesterProgress(selectedLab.semester, semList);
        const completedCount = (milestones||[]).filter(m=>m.completed).length;
        const totalCount = (milestones||[]).length;
        return (
          <div className="log-modal-backdrop" onClick={() => setSelectedLab(null)}>
            <div className="log-modal" style={{maxWidth:760}} onClick={e => e.stopPropagation()}>
              <div className="log-modal-header">
                <div style={{flex:1,minWidth:0}}>
                  <div className="eyebrow" style={{marginBottom:8}}><span className="dot"></span>{selectedLab.semester}</div>
                  <h2 style={{fontFamily:'var(--font-display)',fontSize:26,fontWeight:500,letterSpacing:'-.015em'}}>{selectedLab.title}</h2>
                  {selectedLab.brief?.startsWith('Instructor:') && (
                    <p style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--ink-muted)',marginTop:6}}>
                      {selectedLab.brief.split('·')[0].replace('Instructor: ','').trim()}
                    </p>
                  )}
                </div>
                <div style={{display:'flex',gap:8,alignItems:'flex-start',flexShrink:0}}>
                  {statusPill(selectedLab.status)}
                  <button className="log-modal-close" onClick={() => setSelectedLab(null)}>✕</button>
                </div>
              </div>

              {/* Semester progress */}
              {semProgress && (
                <div style={{padding:'14px 0',borderTop:'1px solid var(--rule)',borderBottom:'1px solid var(--rule)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                    <span style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--ink-muted)'}}>Semester progress</span>
                    <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--ink-muted)'}}>{semProgress.label} · {semProgress.pct}%</span>
                  </div>
                  <div style={{height:8,background:'var(--bg-tint)',borderRadius:99,overflow:'hidden',marginBottom:6}}>
                    <div style={{height:'100%',width:semProgress.pct+'%',background:'var(--purple)',borderRadius:99,transition:'width 400ms'}} />
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',fontFamily:'var(--font-mono)',fontSize:10,color:'var(--ink-muted)'}}>
                    <span>Start {selectedLab.semester.startsWith('SP') ? semProgress.sem?.start_date : semProgress.sem?.start_date}</span>
                    {semProgress.sem?.spring_break_start && <span>🌴 Break {semProgress.sem.spring_break_start}</span>}
                    {semProgress.sem?.fall_break_start && <span>🍂 Break {semProgress.sem.fall_break_start}</span>}
                    {semProgress.sem?.finals_start && <span>📝 Finals {semProgress.sem.finals_start}</span>}
                    <span>End {semProgress.sem?.end_date}</span>
                  </div>
                </div>
              )}

              {/* Stats */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,padding:'14px 0',borderBottom:'1px solid var(--rule)'}}>
                <div style={{textAlign:'center'}}>
                  <div style={{fontFamily:'var(--font-display)',fontSize:32,fontWeight:500,color:'var(--purple)'}}>{selectedLab.enrolled||0}</div>
                  <div style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--ink-muted)',marginTop:4}}>Students</div>
                </div>
                <div style={{textAlign:'center'}}>
                  <div style={{fontFamily:'var(--font-display)',fontSize:32,fontWeight:500,color: totalCount > 0 ? 'var(--success)' : 'var(--ink-muted)'}}>
                    {totalCount > 0 ? `${completedCount}/${totalCount}` : '—'}
                  </div>
                  <div style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--ink-muted)',marginTop:4}}>Milestones</div>
                </div>
                <div style={{textAlign:'center'}}>
                  <div style={{fontFamily:'var(--font-display)',fontSize:32,fontWeight:500,color:'var(--success)'}}>{selectedLab.progress||0}%</div>
                  <div style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--ink-muted)',marginTop:4}}>Complete</div>
                </div>
              </div>

              <div style={{overflowY:'auto',maxHeight:'45vh',display:'flex',flexDirection:'column',gap:20}}>

                {/* Milestones */}
                <div style={{paddingTop:14}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                    <div className="card-sub">Semester milestones</div>
                    {isAdmin && (
                      <button className="btn btn-soft" style={{padding:'6px 12px',fontSize:12}}
                        onClick={() => setAddingMilestone(v => !v)}>
                        {addingMilestone ? 'Cancel' : '+ Add milestone'}
                      </button>
                    )}
                  </div>

                  {addingMilestone && isAdmin && (
                    <div style={{display:'flex',gap:10,marginBottom:12,padding:'12px 14px',background:'var(--purple-soft)',borderRadius:'var(--r-md)'}}>
                      <input
                        placeholder="Milestone title"
                        value={newMilestone.title}
                        onChange={e => setNewMilestone(m => ({...m, title: e.target.value}))}
                        style={{flex:1,padding:'7px 10px',border:'1px solid var(--rule)',borderRadius:'var(--r-sm)',fontSize:13,fontFamily:'var(--font-body)'}}
                      />
                      <input
                        type="date"
                        value={newMilestone.due_date}
                        onChange={e => setNewMilestone(m => ({...m, due_date: e.target.value}))}
                        style={{padding:'7px 10px',border:'1px solid var(--rule)',borderRadius:'var(--r-sm)',fontSize:13,fontFamily:'var(--font-body)'}}
                      />
                      <button className="btn btn-primary" style={{padding:'7px 14px',fontSize:13}} onClick={addMilestone} disabled={saving}>
                        {saving ? '…' : 'Add'}
                      </button>
                    </div>
                  )}

                  {milestonesLoading ? (
                    <div style={{color:'var(--ink-muted)',fontSize:14}}>Loading milestones…</div>
                  ) : !milestones || milestones.length === 0 ? (
                    <div style={{color:'var(--ink-muted)',fontSize:14,fontStyle:'italic'}}>
                      No milestones yet{isAdmin ? ' — add one above' : ''}.
                    </div>
                  ) : (
                    <div style={{display:'flex',flexDirection:'column',gap:8}}>
                      {milestones.map(m => (
                        <div key={m.id} style={{
                          display:'flex',alignItems:'center',gap:12,padding:'10px 14px',
                          borderRadius:'var(--r-md)',
                          background: m.completed ? '#e3f1ea' : 'var(--bg-tint)',
                          border: m.completed ? '1px solid #b8dfc8' : '1px solid var(--rule)',
                          transition:'all 200ms'
                        }}>
                          {isAdmin ? (
                            <button
                              onClick={() => toggleMilestone(m.id)}
                              style={{
                                width:20,height:20,borderRadius:4,flexShrink:0,cursor:'pointer',
                                background: m.completed ? 'var(--success)' : 'white',
                                border: m.completed ? '2px solid var(--success)' : '2px solid var(--rule)',
                                display:'flex',alignItems:'center',justifyContent:'center',
                                color:'white',fontSize:13,fontWeight:700,transition:'all 150ms'
                              }}
                            >{m.completed ? '✓' : ''}</button>
                          ) : (
                            <div style={{
                              width:20,height:20,borderRadius:4,flexShrink:0,
                              background: m.completed ? 'var(--success)' : 'var(--rule)',
                              display:'flex',alignItems:'center',justifyContent:'center',
                              color:'white',fontSize:13,fontWeight:700
                            }}>{m.completed ? '✓' : ''}</div>
                          )}
                          <div style={{flex:1}}>
                            <div style={{
                              fontSize:14,fontWeight:m.completed ? 500 : 400,
                              color: m.completed ? 'var(--success)' : 'var(--ink)',
                              textDecoration: m.completed ? 'none' : 'none'
                            }}>{m.title}</div>
                            <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--ink-muted)',marginTop:2}}>
                              Due {new Date(m.due_date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
                              {m.completed && m.completed_by_name && ` · Completed by ${m.completed_by_name}`}
                            </div>
                          </div>
                          {isAdmin && (
                            <button onClick={() => deleteMilestone(m.id)}
                              style={{color:'var(--ink-muted)',fontSize:16,padding:'0 4px',opacity:.5}}
                              title="Delete milestone">✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Roster */}
                <div style={{borderTop:'1px solid var(--rule)',paddingTop:14}}>
                  <div className="card-sub" style={{marginBottom:10}}>Enrolled students</div>
                  {rosterLoading ? (
                    <div style={{color:'var(--ink-muted)',fontSize:14}}>Loading roster…</div>
                  ) : !roster || roster.length === 0 ? (
                    <div style={{color:'var(--ink-muted)',fontSize:14}}>No roster data on file.</div>
                  ) : (
                    <table className="table" style={{fontSize:13}}>
                      <thead><tr><th>Name</th><th>Major</th><th>Class</th><th>Email</th></tr></thead>
                      <tbody>
                        {roster.map(s => (
                          <tr key={s.id}>
                            <td className="lead">{s.name}</td>
                            <td style={{color:'var(--ink-soft)'}}>{s.major||'—'}</td>
                            <td style={{fontFamily:'var(--font-mono)',fontSize:11}}>{s.class_level||'—'}</td>
                            <td style={{fontFamily:'var(--font-mono)',fontSize:11}}>{s.email||'—'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>

              <div style={{display:'flex',justifyContent:'flex-end',paddingTop:16,borderTop:'1px solid var(--rule)'}}>
                <button className="btn btn-soft" onClick={() => setSelectedLab(null)}>Close</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ── Import Log Error Modal ───────────────────────────────────────────────────
function LogErrorModal({ log, onClose }) {
  const errs = !log.errors ? [] :
    typeof log.errors === 'string'
      ? (() => { try { return JSON.parse(log.errors); } catch { return []; } })()
      : Array.isArray(log.errors) ? log.errors : [];

  return (
    <div className="log-modal-backdrop" onClick={onClose}>
      <div className="log-modal" onClick={e => e.stopPropagation()}>
        <div className="log-modal-header">
          <div>
            <div className="eyebrow" style={{marginBottom:8}}><span className="dot"></span>Import errors</div>
            <h2 style={{fontFamily:'var(--font-display)',fontSize:24,fontWeight:500,letterSpacing:'-.015em'}}>{log.filename}</h2>
            <p style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--ink-muted)',marginTop:6,letterSpacing:'.06em'}}>
              {new Date(log.imported_at).toLocaleString()} &middot; {errs.length} error{errs.length !== 1 ? 's' : ''} &middot; {log.rows_imported} imported of {log.rows_found} found
            </p>
          </div>
          <button className="log-modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="log-modal-errors">
          {errs.length === 0
            ? <div className="empty">No error details stored.</div>
            : errs.map((e, i) => (
                <div key={i} className="log-error-row">
                  <div className="row-label">Row {e.row}</div>
                  <div className="row-msg">{e.message}</div>
                </div>
              ))
          }
        </div>
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <button className="btn btn-soft" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

// ── Import Logs ──────────────────────────────────────────────────────────────
function PageLogs() {
  const [logs, setLogs] = useState(null);
  const [selectedLog, setSelectedLog] = useState(null);

  const loadLogs = useCallback(() => {
    api('GET', '/api/import/logs').then(setLogs).catch(()=>setLogs([]));
  }, []);

  useEffect(loadLogs, [loadLogs]);

  function getErrors(l) {
    if (!l.errors) return [];
    if (typeof l.errors === 'string') {
      try { return JSON.parse(l.errors); } catch { return []; }
    }
    return Array.isArray(l.errors) ? l.errors : [];
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="eyebrow"><span className="dot"></span>Audit trail</div>
          <h1>Import <em>logs.</em></h1>
          <p className="subtitle">Click any row with errors to see exactly what went wrong.</p>
        </div>
        <div className="page-actions">
          <button className="btn btn-soft" onClick={loadLogs}>↺ Refresh</button>
        </div>
      </div>
      <div className="page-body">
        {logs === null ? <div className="empty">Loading…</div> : logs.length === 0 ? (
          <div className="empty">No imports yet — import a spreadsheet first.</div>
        ) : (
          <table className="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>File</th>
                <th>Type</th>
                <th>Found</th>
                <th>Imported</th>
                <th>Skipped</th>
                <th>Errors</th>
                <th>By</th>
              </tr>
            </thead>
            <tbody>
              {logs.map(l => {
                const errs = getErrors(l);
                const hasErrors = errs.length > 0;
                return (
                  <tr
                    key={l.id}
                    className={hasErrors ? 'log-clickable' : ''}
                    onClick={() => hasErrors && setSelectedLog(l)}
                    title={hasErrors ? 'Click to view error details' : ''}
                  >
                    <td style={{fontFamily:'var(--font-mono)',fontSize:12}}>{new Date(l.imported_at).toLocaleString()}</td>
                    <td className="lead">{l.filename}</td>
                    <td><span className="pill pill-plan">{l.sheet_type}</span></td>
                    <td style={{fontFamily:'var(--font-mono)',fontSize:12}}>{l.rows_found}</td>
                    <td style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--success)'}}>{l.rows_imported}</td>
                    <td style={{fontFamily:'var(--font-mono)',fontSize:12}}>{l.rows_skipped}</td>
                    <td>
                      {hasErrors
                        ? <span className="pill pill-full" style={{cursor:'pointer'}}>⚠ {errs.length} error{errs.length!==1?'s':''} — view</span>
                        : <span className="pill pill-open">None</span>
                      }
                    </td>
                    <td>{l.imported_by_name || '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {selectedLog && (
        <LogErrorModal log={selectedLog} onClose={() => setSelectedLog(null)} />
      )}
    </div>
  );
}

// ── App root ────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('mb_user')); } catch { return null; }
  });
  const [view, setView] = useState('home');

  function signOut() {
    localStorage.removeItem('mb_token');
    localStorage.removeItem('mb_user');
    setUser(null); setView('home');
  }

  if (!user) return <SignIn onSignIn={u => { setUser(u); setView('home'); }} />;

  const pages = {
    home:        <PageToday setView={setView} user={user} />,
    import:      <PageImport />,
    camps:       <PageCamps />,
    members:     <PageMembers />,
    equipment:   <PageEquipment />,
    partners:    <PagePartners />,
    changelabs:  <PageChangeLabs />,
    logs:        <PageLogs />,
  };

  return (
    <div className="app">
      <Sidebar view={view} setView={setView} user={user} onSignOut={signOut} />
      <main className="main">{pages[view] || pages.home}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
